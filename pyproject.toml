[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apdif"
version = "0.1.0"
description = "Android Permissions Debugging & Information Framework standalone CLI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "APDIF Maintainers"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
apdif = "apdif.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["apdif*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
